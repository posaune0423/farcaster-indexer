services:
  redis:
    image: redis:latest
    hostname: redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:latest
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: farcaster
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
